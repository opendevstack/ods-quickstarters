componentID: python-fastapi-iq-test
steps:
  - type: provision
    provisionParams:
      verify:
        jenkinsStages: golden/jenkins-provision-stages.json

  - type: build
    buildParams:
      verify:
        jenkinsStages: golden/jenkins-build-stages.json
        runAttachments:
          - sonarqube-report-{{.ProjectID}}-{{.ComponentID}}.pdf
        testResults: 1
        openShiftResources:
          imageStreams:
            - "{{.ComponentID}}"
          services:
            - "{{.ComponentID}}"
          deployments:
            - "{{.ComponentID}}"

  # Step 3: Wait for Helm deployment to complete
  - type: wait
    description: Wait for FastAPI deployment to be ready
    waitParams:
      condition: deployment-complete
      resource: "deployment/{{.ComponentID}}"
      namespace: "{{.ProjectID}}-dev"
      timeout: "5m"
      interval: "5s"

  # Step 4: Wait for pod to be ready
  - type: wait
    description: Wait for application pod to be ready
    waitParams:
      condition: pod-ready
      resource: "-l app.kubernetes.io/name={{.ComponentID}}"
      namespace: "{{.ProjectID}}-dev"
      timeout: "3m"
      interval: "5s"

  # Step 5: Inspect container logs for successful uvicorn startup
  - type: inspect
    description: Verify uvicorn started successfully
    inspectParams:
      resource: "deployment/{{.ComponentID}}"
      namespace: "{{.ProjectID}}-dev"
      checks:
        logs:
          contains:
            - "Started server process"
            - "Waiting for application startup"
            - "Application startup complete"
            - "Uvicorn running on"
          notContains:
            - "ERROR"
            - "fatal error"

  # Step 6: Expose service for testing
  - type: expose-service
    description: Make FastAPI service accessible for tests
    exposeServiceParams:
      services:
        - serviceName: "{{.ComponentID}}"
          namespace: "{{.ProjectID}}-dev"
          port: "8080"

  # Step 7: Test health endpoint with retry
  - type: http
    description: Verify health endpoint returns 200
    retry:
      attempts: 10
      delay: "5s"
      onlyTransient: true
    httpParams:
      url: "http://{{.ComponentID}}.{{.ProjectID}}-dev.svc.cluster.local:8080/health"
      method: GET
      expectedStatus: 200
      expectedBody: "functional/api/health-response.json"
      timeout: 30

  # Step 8: Test root endpoint
  - type: http
    description: Verify root endpoint returns hello world
    httpParams:
      url: "http://{{.ComponentID}}.{{.ProjectID}}-dev.svc.cluster.local:8080/"
      method: GET
      expectedStatus: 200
      timeout: 30

  # Step 9: Run integration smoke tests
  - type: run
    description: Run integration smoke tests
    runParams:
      file: "functional/integration/smoke_test.sh"
      services:
        app: "{{.ComponentID}}"
